{% extends "base.html" %}
{% block styles %}<link rel="stylesheet" href="/static/logs.css" />{% endblock %}
{% block content %}
<main class="page logs-page">
  <section id="logs-workspace" class="logs-workspace">
    <div class="logs-toolbar">
      <form class="log-filters">
        <label>Component<select name="component"><option value="">All</option>{% for value in log_components %}<option value="{{ value }}">{{ value|capitalize }}</option>{% endfor %}</select></label>
        <label>Severity<select name="level"><option value="">All</option>{% for value in ["info", "success", "warning", "error"] %}<option value="{{ value }}">{{ value|capitalize }}</option>{% endfor %}</select></label>
      </form>
    </div>
    <div class="log-table-wrap"><table class="log-table"><thead><tr><th>Time</th><th>Level</th><th>Component</th><th>Message</th></tr></thead><tbody data-log-body>
      {% for entry in logs|reverse %}<tr><td>{{ entry.time }}</td><td class="level {{ entry.level }}">{{ entry.level }}</td><td>{{ entry.component }}</td><td>{{ entry.message }}</td></tr>{% endfor %}
    </tbody></table></div>
  </section>
</main>
{% endblock %}
{% block scripts %}<script type="module" src="/static/logs.js"></script>{% endblock %}
