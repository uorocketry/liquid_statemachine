<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>{% block title %}Liquid State Machine{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css" />
    {% block styles %}{% endblock %}
    <script src="/static/vendor/htmx-2.0.10.min.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div><strong>Liquid State Machine</strong><span>{% block subtitle %}Base station{% endblock %}</span></div>
      </div>
      <nav class="page-nav" aria-label="Primary navigation">
        <a class="{% if active_page == 'dashboard' %}active{% endif %}" href="/">Dashboard</a>
        <a class="{% if active_page == 'runs' %}active{% endif %}" href="/runs">Runs</a>
        <a class="{% if active_page == 'diagnostics' %}active{% endif %}" href="/diagnostics">Diagnostics</a>
      </nav>
      <div class="system-status">
        {% include "fragments/system_status.html" %}
      </div>
    </header>
    {% block content %}{% endblock %}
    <script src="/static/graph-settings.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
