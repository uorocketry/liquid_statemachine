{% extends "base.html" %}
{% set active_page = "dashboard" %}
{% block styles %}
<link rel="stylesheet" href="/static/dashboard-telemetry.css" />
<link rel="stylesheet" href="/static/dashboard-gauge.css" />
{% endblock %}
{% block content %}
<main class="page dashboard-page">
  <section class="telemetry dashboard-telemetry">
    <div id="dashboard-widget-grid" class="dashboard-widget-groups"></div>
    <div id="telemetry-empty" class="telemetry-empty" hidden><a href="/configuration"><span class="ui-icon icon-open-daq" aria-hidden="true"></span><span>DAQ Graph</span></a></div>
    <footer id="telemetry-time-control" class="telemetry-time-control" hidden>
      <div class="telemetry-navigator-wrap">
        <canvas id="telemetry-tier-navigator" aria-label="Telemetry history navigator. Click Full, 60 second context, or 1 second detail to select that scale. Drag any band to scrub the current graph view through time."></canvas>
        <output id="telemetry-time-tooltip" class="telemetry-time-tooltip" hidden></output>
      </div>
      <div class="telemetry-time-actions">
        <button id="dashboard-layout-edit" class="dashboard-layout-action" type="button">Edit</button>
        <details class="dashboard-widget-picker" hidden><summary class="icon-button" aria-label="Choose dashboard widgets" title="Widgets"><span class="ui-icon icon-signals" aria-hidden="true"></span></summary><div id="dashboard-widget-options" class="dashboard-widget-options"></div></details>
        <button id="dashboard-layout-cancel" class="dashboard-layout-action" type="button" hidden>Cancel</button>
        <button id="dashboard-layout-save" class="dashboard-layout-action dashboard-layout-save" type="button" hidden>Save</button>
        <button id="telemetry-return-tail" class="icon-button telemetry-return-tail" type="button" hidden aria-label="Follow newest samples" title="Follow newest samples"><span class="ui-icon icon-end" aria-hidden="true"></span></button>
      </div>
    </footer>
  </section>
</main>
{% endblock %}
{% block scripts %}<script type="module" src="/static/dashboard-telemetry.js"></script>{% endblock %}
