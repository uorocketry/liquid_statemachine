{% extends "base.html" %}
{% block styles %}
<link rel="stylesheet" href="/static/dashboard-base.css" />
<link rel="stylesheet" href="/static/dashboard-timeline.css" />
<link rel="stylesheet" href="/static/dashboard-gauge.css" />
{% endblock %}
{% block content %}
<main class="page dashboard-page dashboard-live-page">
  <section class="telemetry dashboard-telemetry">
    <div id="dashboard-viewport" class="dashboard-viewport" role="region" aria-label="Read-only Live Dashboard. Press 1, 2, or 3 to select a saved Dashboard view.">
      <div id="dashboard-widget-grid" class="dashboard-widget-groups"></div>
      <div id="telemetry-empty" class="telemetry-empty" hidden><a href="/dashboard/layout"><span class="ui-icon icon-dashboard" aria-hidden="true"></span><span>Dashboard Layout</span></a></div>
    </div>
    <footer id="telemetry-time-control" class="telemetry-time-control" hidden>
      <button id="telemetry-return-tail" class="telemetry-return-tail" type="button" hidden aria-label="Follow newest samples" title="Follow newest samples"><span class="ui-icon icon-end" aria-hidden="true"></span></button>
      <div class="telemetry-navigator-wrap">
        <canvas id="telemetry-tier-navigator" aria-label="Telemetry history navigator. Click Full, 60 second context, or 1 second detail to select that scale. Drag any band to scrub the current graph view through time."></canvas>
        <output id="telemetry-time-tooltip" class="telemetry-time-tooltip" hidden></output>
      </div>
    </footer>
  </section>
</main>
{% endblock %}
{% block scripts %}<script type="module" src="/static/dashboard-presenter.js"></script>{% endblock %}
