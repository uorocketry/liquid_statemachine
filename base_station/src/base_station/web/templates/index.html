{% extends "base.html" %}
{% set active_page = "dashboard" %}
{% block subtitle %}Live telemetry{% endblock %}
{% block styles %}<link rel="stylesheet" href="/static/dashboard-telemetry.css" />{% endblock %}
{% block content %}
<main class="dashboard-page">
  <section class="telemetry dashboard-telemetry">
    <div class="telemetry-heading">
      <h2>Telemetry</h2>
      <div class="telemetry-actions">
        <span id="telemetry-live-state" class="telemetry-live-state">—</span>
        <details class="telemetry-signal-picker"><summary>Signals</summary><div id="telemetry-signal-options" class="telemetry-signal-options"></div></details>
      </div>
    </div>
    <div id="telemetry-signal-grid" class="blueprint-telemetry-grid"></div>
    <div id="telemetry-empty" class="telemetry-empty" hidden><a href="/configuration">Open DAQ Setup</a></div>
    {% include "fragments/events.html" %}
  </section>
</main>
{% endblock %}
{% block scripts %}<script type="module" src="/static/dashboard-telemetry.js"></script>{% endblock %}
