{% extends "base.html" %}
{% set active_page = "dashboard" %}
{% block styles %}<link rel="stylesheet" href="/static/dashboard-telemetry.css" />{% endblock %}
{% block content %}
<main class="page dashboard-page">
  <section class="telemetry dashboard-telemetry">
    <header class="page-heading">
      <h1>Dashboard</h1>
      <div class="telemetry-actions">
        <span id="telemetry-live-state" class="telemetry-live-state">—</span>
        <details class="telemetry-signal-picker"><summary class="icon-button" aria-label="Signals" title="Signals"><span class="ui-icon icon-signals" aria-hidden="true"></span></summary><div id="telemetry-signal-options" class="telemetry-signal-options"></div></details>
      </div>
    </header>
    <div id="telemetry-signal-grid" class="blueprint-telemetry-grid"></div>
    <div id="telemetry-empty" class="telemetry-empty" hidden><a href="/configuration"><span class="ui-icon icon-open-daq" aria-hidden="true"></span><span>DAQ Setup</span></a></div>
  </section>
</main>
{% endblock %}
{% block scripts %}<script type="module" src="/static/dashboard-telemetry.js"></script>{% endblock %}
