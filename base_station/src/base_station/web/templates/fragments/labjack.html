{% set acquisition_active = labjack.acquisition_state in ["starting", "running", "stopping"] %}
<div id="labjack-fragment" class="runs-recorder" data-runs-recorder data-configured-rate="{{ configured_scan_rate }}">
  <div class="runs-recorder-meta">
    <span data-run-state class="recording-badge {% if labjack.acquisition_state == 'running' %}active{% endif %}"{% if not acquisition_active %} hidden{% endif %}>{{ labjack.acquisition_state|capitalize }}</span>
    <span data-run-rate>{{ configured_scan_rate }} samples/s</span>
    <a data-run-link class="detail-link" href="{% if labjack.current_run_id %}/runs/{{ labjack.current_run_id }}{% else %}#{% endif %}"{% if not labjack.current_run_id %} hidden{% endif %}>Run {{ labjack.current_run_id or "" }}</a>
  </div>
  <button data-record-action="start" type="button" class="record-control"{% if not labjack.connected or acquisition_active %} hidden{% endif %}>
    <span class="record-symbol" aria-hidden="true"></span><strong>Record</strong>
  </button>
  <button data-record-action="stop" type="button" class="record-control stop-record"{% if not acquisition_active %} hidden{% endif %}{% if labjack.acquisition_state == "stopping" %} disabled{% endif %}>
    <span class="record-symbol" aria-hidden="true"></span><strong>Stop</strong><small data-run-duration>{{ format_duration(labjack.sample_count / labjack.scan_rate) }}</small>
  </button>
  <span data-run-operation class="operation-status {% if labjack.acquisition_state in ['starting', 'stopping'] %}pending{% endif %}"{% if not acquisition_active or not labjack.operation_message %} hidden{% endif %}>{{ labjack.operation_message or "" }}</span>
</div>
